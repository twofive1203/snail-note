services:
  snail-note:
    build: .
    container_name: snail-note
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      SNAIL_NOTE_DATA_DIR: /data
    volumes:
      - "${NOTEBOOK_HOST_PATH:-./snail-notes}:/notes"
      - "snail-note-data:/data"

volumes:
  snail-note-data:
